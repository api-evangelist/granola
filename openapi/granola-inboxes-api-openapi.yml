openapi: 3.2.0
info:
  title: Trigger Inbox Inboxes API
  description: Manage trigger inboxes and their messages — create, pause, resume, and delete inboxes; list, lease, and acknowledge messages.
  version: 1.0.0
  contact:
    url: https://docs.zapier.com
servers:
- url: https://api.zapier.com
  description: Production
security:
- OAuth: []
tags:
- name: Inboxes
  description: Create and manage trigger inboxes
paths:
  /trigger-inbox/v1/inboxes:
    get:
      operationId: listTriggerInboxes
      description: List all inboxes for the authenticated user.
      summary: List all inboxes
      parameters:
      - in: query
        name: key
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: name
        schema:
          type: string
        deprecated: true
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - deleting
          - initialization_failure
          - initializing
          - paused
        description: '* `initializing` - initializing

          * `active` - active

          * `paused` - paused

          * `deleting` - deleting

          * `initialization_failure` - initialization_failure'
      tags:
      - Inboxes
      security:
      - OAuth:
        - external
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInboxList'
          description: 'An inbox: a durable, user-scoped queue for a trigger subscription,

            identified by its natural `key`.'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          description: 'Validation Error: Return fields with errors.'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '429':
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          description: Too many requests.
      x-zapier-collection-response-exempt: true
    post:
      operationId: createTriggerInbox
      description: Create a new inbox. If a key is provided and an inbox with that key already exists for this user, returns 409 Conflict. name remains accepted as a deprecated alias for key. Use PUT for idempotent get-or-create semantics.
      summary: Create an inbox
      parameters:
      - in: header
        name: Zapier-Causation-Id
        schema:
          type: string
        description: Optional UUID identifying the event or action that caused this request.
      - in: header
        name: Zapier-Correlation-Id
        schema:
          type: string
        description: Optional UUID to trace this request through downstream systems.
      tags:
      - Inboxes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inbox'
            examples:
              WithKey:
                value:
                  key: example_inbox
                  subscription:
                    app_key: SlackCLIAPI@1.0.0
                    action_key: example_action
                    connection_id: 029a64f8-ced3-889b-aa1a-9d37bcd59ddb
                    inputs:
                      channel: C1234567890
                summary: with_key
              WithNameDeprecated:
                value:
                  name: example_inbox
                  subscription:
                    app_key: SlackCLIAPI@1.0.0
                    action_key: example_action
                    connection_id: 029a64f8-ced3-889b-aa1a-9d37bcd59ddb
                    inputs:
                      channel: C1234567890
                summary: with_name_deprecated
                description: Uses the deprecated name alias for key.
              WithoutKey:
                value:
                  subscription:
                    app_key: SlackCLIAPI@1.0.0
                    action_key: example_action
                    connection_id: 5678
                    inputs:
                      channel: C1234567890
                summary: without_key
              WithSlugAppKey:
                value:
                  key: example_inbox
                  subscription:
                    app_key: slack
                    action_key: example_action
                    connection_id: 029a64f8-ced3-889b-aa1a-9d37bcd59ddb
                    inputs:
                      channel: C1234567890
                summary: Resolve app_key from a slug
                description: A versionless slug is resolved to the latest version; the response's subscription.app_key is the fully-versioned form.
        required: true
      security:
      - OAuth:
        - external
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inbox'
          description: 'An inbox: a durable, user-scoped queue for a trigger subscription,

            identified by its natural `key`.'
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          description: Validation error, e.g. the app_key could not be resolved to a single app (unknown or ambiguous), or a claim input was invalid.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          description: Conflict error when an inbox with the same key already exists for the user.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
        '429':
          headers:
            Retry-After:
              $ref: '#/components/headers/Retry-After'
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/X-RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Errors'
          description: Too many requests.
    put:
      operationId: ensureTriggerInbox
      description: Idempotently ensure an inbox exists for the provided key. Returns the existing inbox if one with the same key and matching configuration already exists, or creates a new one. name remains accepted as a deprecated alias for key. Returns 409 if an inbox with the same key but different configuration exists.
