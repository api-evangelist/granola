  /trigger-inbox/v1/inboxes/{inbox_id}/events:
    get:
      operationId: getTriggerInboxEvents
      tags:
      - Inboxes
      summary: Subscribe to inbox notifications over SSE
      description: 'Opens a Server-Sent Events stream that emits one frame per batch of newly-available messages on the inbox. The connection stays open until the JWT expires, at which point the server closes it.


        Two kinds of frames are emitted:


        - **Data frames** (`data: {...}\n\n`) signal availability only, they do not include message content. Consumers should call the lease endpoint to retrieve messages. The JSON payload is described by the response schema below. Each data frame includes a cursor that clients can provide when reconnecting. Catch-up delivery is at least once, so messages within the lookback window may be reported again.

        - **Heartbeat frames** (`: keep-alive\n\n`) are SSE comment lines sent when no notification has arrived within the heartbeat interval. They are ignored by EventSource clients and exist only to keep intermediaries from closing the connection as idle.'
      security:
      - OAuth:
        - external
      parameters:
      - name: inbox_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the inbox to subscribe to.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: An opaque cursor from the most recently received data frame. When provided, the stream immediately reports messages that may have arrived since that cursor. Cursors older than the message retention period are rejected.
      responses:
        '200':
          description: SSE stream opened. The response body is an open-ended sequence of `text/event-stream` frames.
          content:
            text/event-stream:
              schema:
                type: object
                description: JSON payload carried by each `data:` frame. Heartbeat frames carry no payload.
                properties:
                  inbox_id:
                    type: string
                    format: uuid
                    description: The unique identifier of the inbox that has new messages.
                  count:
                    type: integer
                    minimum: 1
                    description: The number of notifications coalesced into this frame.
                  cursor:
                    type: string
                    description: An opaque cursor that clients should store and provide when reconnecting.
                required:
                - inbox_id
                - count
                - cursor
        '400':
          description: The cursor is malformed, expired, out of range, or uses an unsupported version.
        '401':
          description: Missing or invalid JWT in the Authorization header.
        '404':
          description: No inbox with the given id is visible to the authenticated user.
        '503':
          description: The notification backend was not reachable in time. Clients should retry.
components:
  schemas:
    PaginatedInboxList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          description: Total number of results across all pages.
          example: 123
        next:
          type: string
          description: Link to next page of results if any.
          nullable: true
          format: uri
          example: https://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          description: Link to previous page of results if any.
