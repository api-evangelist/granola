- aid: granola:public-api
  name: Granola Public API
  description: >-
    REST API for programmatic access to meeting notes, transcripts, AI summaries, and folders. Authentication
    is Bearer token using API keys prefixed with `grn_`, created in Settings → Connectors → API keys.
    Requires Business or Enterprise plan. Endpoints include GET /notes, GET /notes/{id}, and GET /folders.
    Rate limits are 25 requests burst / 5 requests per second sustained. Webhooks are on the roadmap;
    current pattern is polling.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.granola.ai/help-center/sharing/integrations/granola-api
  baseURL: https://public-api.granola.ai/v1
